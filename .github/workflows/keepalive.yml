name: Keep scheduled workflows enabled

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. Re-enabling a workflow resets that counter, so a
# weekly forced "enable" keeps the ten-minute automation alive at no cost.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in automation.yml keepalive.yml; do
            gh api --method PUT "repos/${REPO}/actions/workflows/${workflow}/enable" \
              && echo "${workflow}: enabled" \
              || echo "::warning::Could not re-enable ${workflow}. Enable it manually in the Actions tab."
          done
